security:
  enable_authenticator_manager: true

  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        default_target_path: business_list
      logout:
        path: app_logout
        target: index
      remember_me:
        secret: '%kernel.secret%'
        always_remember_me: true
        signature_properties: ['password']

  access_control:
    - { path: ^/health, roles: PUBLIC_ACCESS }
    - { path: ^/admin/, roles: [ ROLE_ADMIN ] }
    - { path: ^/api/v1/admin/, roles: [ ROLE_ADMIN ] }
    - { path: ^/api/v1/review/generate-guest, roles: [ IS_AUTHENTICATED_ANONYMOUSLY ] }
    - { path: ^/api/v1/google/place/, roles: [ IS_AUTHENTICATED_ANONYMOUSLY ] }
    - { path: ^/api/v1/landing/, roles: [ IS_AUTHENTICATED_ANONYMOUSLY ] }
    - { path: ^/api/v1/change-password/, roles: [ IS_AUTHENTICATED_ANONYMOUSLY ] }
    - { path: ^/api/v1/, roles: [ ROLE_ADMIN ] }
    - { path: ^/login, roles: [ IS_AUTHENTICATED_ANONYMOUSLY, ROLE_USER ] }
    - { path: ^/, roles: [ IS_AUTHENTICATED_ANONYMOUSLY, ROLE_USER ] }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
